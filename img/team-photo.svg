<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Group of Players Avatar Silhouettes -->
  <g transform="translate(300, 180)">
    <!-- Back row -->
    <circle cx="-60" cy="-30" r="35" fill="#475569" stroke="#1e293b" stroke-width="3" />
    <path d="M-95,5 L-25,5 C-25,-15 -95,-15 -95,5 Z" fill="#475569" />
    
    <circle cx="60" cy="-30" r="35" fill="#475569" stroke="#1e293b" stroke-width="3" />
    <path d="M25,5 L95,5 C95,-15 25,-15 25,5 Z" fill="#475569" />
    
    <!-- Front row -->
    <circle cx="0" cy="0" r="40" fill="#3b82f6" stroke="#1e293b" stroke-width="4" />
    <path d="M-45,40 L45,40 C45,15 -45,15 -45,40 Z" fill="#3b82f6" />
    
    <!-- Left player -->
    <circle cx="-100" cy="10" r="35" fill="#ef4444" stroke="#1e293b" stroke-width="3" />
    <path d="M-135,45 L-65,45 C-65,25 -135,25 -135,45 Z" fill="#ef4444" />
    
    <!-- Right player -->
    <circle cx="100" cy="10" r="35" fill="#10b981" stroke="#1e293b" stroke-width="3" />
    <path d="M65,45 L135,45 C135,25 65,25 65,45 Z" fill="#10b981" />
  </g>
  
  <text x="300" y="320" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">
    NUESTROS EQUIPOS
  </text>
  <text x="300" y="345" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Jugadores y Categorías Federadas y de Recreación
  </text>
</svg>
