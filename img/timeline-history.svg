<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <g transform="translate(300, 160)">
    <!-- Historic Trophy Cup -->
    <path d="M-40,-50 L40,-50 L35,10 C35,30 20,45 0,45 C-20,45 -35,30 -35,10 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <!-- Handles -->
    <path d="M-40,-35 C-60,-35 -60,-10 -37,-5" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <path d="M40,-35 C60,-35 60,-10 37,-5" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <!-- Stem/Base -->
    <rect x="-10" y="45" width="20" height="25" fill="#d97706" />
    <polygon points="-30,80 -20,70 20,70 30,80" fill="#78350f" />
    <!-- Star on trophy -->
    <path d="M0,-25 L3,-15 L12,-15 L5,-10 L8,0 L0,-5 L-8,0 L-5,-10 L-12,-15 L-3,-15 Z" fill="#ffffff" />
    <!-- Decorative circles -->
    <circle cx="-100" cy="10" r="15" fill="#3b82f6" opacity="0.3" />
    <circle cx="100" cy="10" r="25" fill="#ef4444" opacity="0.2" />
  </g>
  
  <text x="300" y="300" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">
    HISTORIA DEL CLUB
  </text>
  <text x="300" y="325" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Años de Trayectoria, Esfuerzo y Títulos Conseguidos
  </text>
</svg>
