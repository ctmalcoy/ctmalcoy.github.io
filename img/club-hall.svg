<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="150" r="120" fill="#3b82f6" opacity="0.05" />
  
  <g transform="translate(300, 180)">
    <!-- Club Emblem / Shield -->
    <path d="M-60,-80 L60,-80 L80,-20 Q80,60 0,100 Q-80,60 -80,-20 Z" fill="none" stroke="#3b82f6" stroke-width="4" />
    <path d="M-50,-70 L50,-70 L68,-20 Q68,50 0,85 Q-68,50 -68,-20 Z" fill="#3b82f6" opacity="0.1" />
    
    <!-- Crossed Paddles in Shield -->
    <g transform="rotate(30) scale(0.6)">
      <path d="M -15,40 C -15,10 -5,-15 15,-15 C 35,-15 45,10 45,40 C 45,70 35,80 15,80 C -5,80 -12,70 -14,55 L -30,70 C -35,75 -40,75 -45,70 C -50,65 -50,55 -45,50 L -30,40 Z" fill="#ef4444" />
    </g>
    <g transform="rotate(-30) scale(0.6) translate(-15, -40)">
      <path d="M -15,40 C -15,10 -5,-15 15,-15 C 35,-15 45,10 45,40 C 45,70 35,80 15,80 C -5,80 -12,70 -14,55 L -30,70 C -35,75 -40,75 -45,70 C -50,65 -50,55 -45,50 L -30,40 Z" fill="#3b82f6" />
    </g>
    <!-- Little Ball -->
    <circle cx="0" cy="0" r="10" fill="#f97316" />
  </g>
  
  <text x="300" y="320" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">
    CTM ALCOY
  </text>
  <text x="300" y="345" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Nuestra Identidad, Valores e Instalaciones
  </text>
</svg>
