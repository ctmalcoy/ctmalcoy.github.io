<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <g transform="translate(300, 160)">
    <!-- Document/Newspaper Graphic -->
    <rect x="-60" y="-70" width="120" height="140" rx="8" fill="#ffffff" />
    <!-- Header banner in document -->
    <rect x="-50" y="-60" width="100" height="20" fill="#3b82f6" rx="2" />
    <!-- Lines of text in document -->
    <rect x="-50" y="-30" width="100" height="6" fill="#e2e8f0" rx="1" />
    <rect x="-50" y="-15" width="80" height="6" fill="#e2e8f0" rx="1" />
    <rect x="-50" y="0" width="95" height="6" fill="#e2e8f0" rx="1" />
    
    <!-- Red Accent Stamp / Medal -->
    <circle cx="45" cy="45" r="25" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <polygon points="45,35 48,42 55,42 50,46 52,53 45,49 38,53 40,46 35,42 42,42" fill="#ffffff" />
  </g>
  
  <text x="300" y="310" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">
    NOTICIAS Y EVENTOS
  </text>
  <text x="300" y="335" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Actualidad del Tenis de Mesa en Alcoy
  </text>
</svg>
