<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <g transform="translate(300, 180)">
    <!-- Speed/motion lines -->
    <line x1="-150" y1="30" x2="150" y2="-30" stroke="#ef4444" stroke-width="6" opacity="0.3" stroke-dasharray="20,10" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#3b82f6" stroke-width="4" opacity="0.2" stroke-dasharray="15,5" />
    <line x1="-180" y1="-30" x2="180" y2="30" stroke="#f59e0b" stroke-width="2" opacity="0.2" stroke-dasharray="30,15" />
    
    <!-- Big Orange Ball with motion blur effect -->
    <circle cx="0" cy="0" r="35" fill="#f97316" />
    <path d="M-30,-18 A35,35 0 0,1 30,18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4" />
    <circle cx="-10" cy="-10" r="8" fill="#ffffff" opacity="0.6" />
    
    <!-- Rackets surrounding -->
    <g transform="translate(-140, 20) rotate(45) scale(0.6)">
      <circle cx="0" cy="0" r="60" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
      <rect x="-10" y="50" width="20" height="60" rx="5" fill="#d97706" />
    </g>
    <g transform="translate(140, -40) rotate(-135) scale(0.6)">
      <circle cx="0" cy="0" r="60" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
      <rect x="-10" y="50" width="20" height="60" rx="5" fill="#d97706" />
    </g>
  </g>
  
  <text x="300" y="320" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">
    COMPETICIÓN Y PARTIDOS
  </text>
  <text x="300" y="345" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Resultados, Calendarios y Rivales del Club
  </text>
</svg>
